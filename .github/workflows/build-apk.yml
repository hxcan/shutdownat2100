name: Build APK

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Android SDK components
      run: |
        export ANDROID_HOME=/usr/local/lib/android/sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin
        yes | sdkmanager --licenses > /dev/null 2>&1 || true
        # 34.0.0: AGP 8.4.1 默认 build-tools（编译用）
        # 29.0.3: r0adkll/sign-android-release@v1 硬编码查找 zipalign（签名用）
        sdkmanager "platforms;android-33" "build-tools;34.0.0" "build-tools;29.0.3"

    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission to gradlew
      run: chmod +x gradlew

    - name: Update lint baseline
      run: |
        export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx2048m -Dorg.gradle.daemon=false"
        ./gradlew updateLintBaseline --warning-mode none || true

    - name: Build with Gradle (with retry, warnings disabled)
      run: |
        export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx2048m -Dorg.gradle.daemon=false"
        ./gradlew build --warning-mode none || ./gradlew build --warning-mode none

    - name: Assemble Debug APK
      run: ./gradlew assembleDebug --warning-mode none

    - name: Assemble Release APK
      run: ./gradlew assembleRelease --warning-mode none

    - name: List Debug APK Files
      run: |
        echo "=== Debug APK Directory ==="
        ls -la app/build/outputs/apk/debug/ || echo "Directory not found"
        find app/build/outputs -name "*.apk" || echo "No APK files found"

    # Keystore Secrets are not configured in this repository yet. Until they are,
    # this step fails on an invalid/empty keystore. continue-on-error keeps the
    # main line (compile + Debug APK) green; signing kicks in automatically once
    # the Secrets are added.
    #
    # Two naming conventions are accepted so the owner can copy the Secrets
    # verbatim from either of their other repos:
    #   hxcan/sisterfuture     : APK_KEY_STORE / KEYSTORE_ALIAS / KEY_STORE_PASSWORD
    #   hxcan/dynamicwallpaper : KEY_STORE_CONTENT_BASE64 / KEYSTORE_ALIAS / KEYSTORE_SECRET
    - name: Sign Release APK
      id: sign_release
      continue-on-error: true
      uses: r0adkll/sign-android-release@v1
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.APK_KEY_STORE || secrets.KEY_STORE_CONTENT_BASE64 }}
        alias: ${{ secrets.KEYSTORE_ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD || secrets.KEYSTORE_SECRET }}
        keyPassword: ${{ secrets.KEY_STORE_PASSWORD || secrets.KEYSTORE_SECRET }}

    - name: List Signed APK Files
      run: |
        echo "=== After Signing ==="
        ls -la app/build/outputs/apk/release/ || echo "Directory not found"
        find app/build/outputs -name "*-signed.apk" || echo "No signed APK files found"

    - name: Upload Debug APK artifact (PR)
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: shutdownat2100-debug
        path: app/build/outputs/apk/debug/*.apk

    - name: Upload Signed Release APK artifact (PR)
      if: github.event_name == 'pull_request' && steps.sign_release.outputs.signedReleaseFile != ''
      uses: actions/upload-artifact@v4
      with:
        name: shutdownat2100-release-signed
        path: ${{ steps.sign_release.outputs.signedReleaseFile }}

    - name: Upload updated lint baseline
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: shutdownat2100-lint-baseline
        path: app/lint-baseline.xml

    - name: Create CI Release (master push)
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ci/auto-build-${{ github.run_number }}
        name: 🤖 CI Build #${{ github.run_number }}
        files: |
          app/build/outputs/apk/debug/*.apk
          ${{ steps.sign_release.outputs.signedReleaseFile }}
        prerelease: true
        generate_release_notes: true
        token: ${{ secrets.GITHUB_TOKEN }}
        body: |
          ## 🤖 自动构建版本

          **构建编号:** ${{ github.run_number }}
          **提交:** ${{ github.sha }}
          **时间:** ${{ github.event.head_commit.timestamp }}

          ---
          ### 📦 下载
          - **Debug 版**: `app-debug-*.apk` (自动签名，仅供测试)
          - **Release 版**: `app-release-*-signed.apk` (正式签名，可覆盖安装)

          ⚠️ Release 版本使用正式证书签名，支持覆盖安装和正式分发。

          ---
          ### 🔗 下载方式
          点击上方的文件即可下载，**无需登录**。
