name: Build APK

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# 必需：softprops/action-gh-release 需要 contents: write 才能创建 tag 和 Release
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: temurin
      - name: Install Android SDK components
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          # 34.0.0: AGP 8.4.1 默认 build-tools（编译用）
          # 29.0.3: r0adkll/sign-android-release@v1 硬编码查找 zipalign（签名用）
          sdkmanager "platforms;android-33" "build-tools;34.0.0" "build-tools;29.0.3"
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Update lint baseline
        run: |
          chmod +x gradlew
          export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx2048m -Dorg.gradle.daemon=false"
          ./gradlew updateLintBaseline --warning-mode none || true
      - name: Build with Gradle (Debug)
        run: |
          chmod +x gradlew
          export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx2048m -Dorg.gradle.daemon=false"
          ./gradlew :app:assembleDebug --warning-mode none
      - name: Assemble Release APK (unsigned)
        run: |
          chmod +x gradlew
          export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx2048m -Dorg.gradle.daemon=false"
          ./gradlew :app:assembleRelease --warning-mode none
      - name: List Debug APK Files
        run: |
          echo "=== Debug APK Directory ==="
          ls -la app/build/outputs/apk/debug/ || echo "Directory not found"
          find app/build/outputs -name "*.apk" || echo "No APK files found"
      - name: Sign Release APK with the release keystore
        id: sign_release
        # 正式版签名：用 Secrets 里的 release keystore
        # Secrets 名称与 hxcan/sisterfuture 保持一致：
        #   APK_KEY_STORE  - release keystore 的 base64 编码
        #   KEYSTORE_ALIAS - keystore 别名
        #   KEY_STORE_PASSWORD - keystore 密码
        # 若 Secrets 未配置，此步失败但不影响编译与 Debug APK 产出
        continue-on-error: true
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.APK_KEY_STORE }}
          alias: ${{ secrets.KEYSTORE_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
      - name: List Signed Release APK Files
        run: |
          echo "=== After Signing ==="
          ls -la app/build/outputs/apk/release/ || echo "Directory not found"
          find app/build/outputs -name "*-signed.apk" || echo "No signed APK files found"
      - name: Upload Debug APK artifact (PR)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: shutdownat2100-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Upload Signed Release APK artifact (PR)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: shutdownat2100-release-signed
          path: app/build/outputs/apk/release/*.apk
      - name: Upload updated lint baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shutdownat2100-lint-baseline
          path: app/lint-baseline.xml
      - name: Create CI Release (master push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci/auto-build-${{ github.run_number }}
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          prerelease: true
      - name: Verify release notes
        run: |
          echo "=== CI Build ${{ github.run_number }} ==="
          echo "Commit: ${{ github.sha }}"
          echo "Tag: ci/auto-build-${{ github.run_number }}"
          echo "Release notes generated from commit history"
          echo "Timestamp: ${{ github.event.head_commit.timestamp }}"
