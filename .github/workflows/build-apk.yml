name: Build ShutdownAt2100 APK

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission to gradlew
      run: chmod +x gradlew

    - name: Install Build Tools via SDK Manager
      run: |
        export ANDROID_HOME=/usr/local/lib/android/sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin
        yes | sdkmanager "build-tools;34.0.0"

    # NOTE: the committed app/lint-baseline.xml was generated by AGP 7.4.1, while
    # the project now uses AGP 8.4.1. AGP 8 rejects a baseline written by an
    # older AGP with "baseline file was created by a different version of AGP",
    # so we regenerate it before running lint.
    - name: Regenerate Lint baseline
      run: ./gradlew :app:updateLintBaseline --warning-mode none || true

    - name: Run Lint with baseline
      run: ./gradlew :app:lintDebug --warning-mode none

    - name: Build Debug and Release APKs
      run: |
        export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx2048m -Dorg.gradle.daemon=false"
        ./gradlew assembleDebug assembleRelease --warning-mode none

    - name: List Debug APK Files
      run: |
        echo "=== Debug APK Directory ==="
        ls -la app/build/outputs/apk/debug/ || echo "Directory not found"
        find app/build/outputs -name "*.apk" || echo "No APK files found"

    # Uses pre-existing secrets (same names as hxcan/dynamicwallpaper):
    #   - KEY_STORE_CONTENT_BASE64: keystore file as base64
    #   - KEYSTORE_ALIAS: keystore alias
    #   - KEYSTORE_SECRET: keystore password
    - name: Sign Release APK
      id: sign_release
      uses: r0adkll/sign-android-release@v1
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.KEY_STORE_CONTENT_BASE64 }}
        alias: ${{ secrets.KEYSTORE_ALIAS }}
        keyStorePassword: ${{ secrets.KEYSTORE_SECRET }}
        keyPassword: ${{ secrets.KEYSTORE_SECRET }}

    - name: List Signed APK Files
      run: |
        echo "=== After Signing ==="
        ls -la app/build/outputs/apk/release/ || echo "Directory not found"
        find app/build/outputs -name "*-signed.apk" || echo "No signed APK files found"

    # Upload lint baseline as artifact (priority - even if signing fails)
    - name: Upload lint baseline
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: shutdownat2100-lint-baseline
        path: app/lint-baseline.xml
        if-no-files-found: ignore

    - name: Upload Debug APK artifact (PR)
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: shutdownat2100-debug
        path: app/build/outputs/apk/debug/*.apk

    - name: Upload Signed Release APK artifact (PR)
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: shutdownat2100-release-signed
        path: ${{ steps.sign_release.outputs.signedReleaseFile }}

    - name: Upload Artifacts on master push
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      uses: actions/upload-artifact@v4
      with:
        name: shutdownat2100-build-${{ github.run_number }}
        path: |
          app/build/outputs/apk/debug/*.apk
          ${{ steps.sign_release.outputs.signedReleaseFile }}

    - name: Rename APKs for release
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      id: rename_apks
      run: |
        set -e
        VERSION_NAME=$(grep -oE 'versionName[[:space:]]+"[^"]+"' app/build.gradle | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
        VERSION_CODE=$(grep -oE 'versionCode[[:space:]]+[0-9]+' app/build.gradle | head -1 | awk '{print $2}')
        VERSION_NAME=${VERSION_NAME:-0.0.0}
        VERSION_CODE=${VERSION_CODE:-0}
        BUILD_TS=$(date -u +%Y%m%d-%H%M)
        echo "Detected: versionName=${VERSION_NAME} versionCode=${VERSION_CODE} buildTs=${BUILD_TS}"

        DEBUG_SRC=$(ls app/build/outputs/apk/debug/*.apk | head -1)
        DEBUG_DST="shutdownat2100-debug-v${VERSION_NAME}-${VERSION_CODE}-${BUILD_TS}.apk"
        cp "${DEBUG_SRC}" "${DEBUG_DST}"

        RELEASE_SRC="${{ steps.sign_release.outputs.signedReleaseFile }}"
        RELEASE_DST="shutdownat2100-release-v${VERSION_NAME}-${VERSION_CODE}-${BUILD_TS}-signed.apk"
        cp "${RELEASE_SRC}" "${RELEASE_DST}"

        echo "debug_artifact=${DEBUG_DST}" >> "$GITHUB_OUTPUT"
        echo "release_artifact=${RELEASE_DST}" >> "$GITHUB_OUTPUT"
        ls -la shutdownat2100-*.apk

    - name: Create CI Release (master push)
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ci/auto-build-${{ github.run_number }}
        name: 🤖 CI Build #${{ github.run_number }}
        files: |
          ${{ steps.rename_apks.outputs.debug_artifact }}
          ${{ steps.rename_apks.outputs.release_artifact }}
        prerelease: true
        generate_release_notes: true
        token: ${{ secrets.GITHUB_TOKEN }}
        body: |
          ## 🤖 自动构建版本

          **构建编号:** ${{ github.run_number }}
          **提交:** ${{ github.sha }}
          **时间:** ${{ github.event.head_commit.timestamp }}

          ---
          ### 📦 下载
          - **Debug 版**: `shutdownat2100-debug-v*.apk` (自动签名，仅供测试)
          - **Release 版**: `shutdownat2100-release-v*-signed.apk` (正式签名，可覆盖安装)

          ⚠️ Release 版本使用正式证书签名，支持覆盖安装和正式分发。

          ### 🔗 下载方式
          点击上方的文件即可下载，**无需登录**。
