name: Build APK
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install Android SDK components
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;34.0.0" "build-tools;29.0.3"
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Update lint baseline
        run: |
          chmod +x gradlew
          ./gradlew :app:updateLintBaseline --no-daemon -Dorg.gradle.javaargsonient=true
      - name: Build with Gradle (Debug + Release)
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon -Dorg.gradle.javaargsonient=true
      - name: List Debug APK Files
        run: |
          echo "=== Debug APKs ==="
          find app/build/outputs/apk/debug -name "*.apk" || echo "Directory not found"
      - name: List Signed Release APK Files
        run: |
          echo "=== Signed Release APKs ==="
          find app/build/outputs/apk/release -name "*.apk" || echo "Directory not found"
      - name: List Debug APK Files (PR)
        if: github.event_name == 'pull_request'
        run: |
          ls -la app/build/outputs/apk/debug/ | grep "*.apk" || echo "No APK files found"
      - name: Upload Debug APK artifact (PR)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: shutdownat2100-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Upload Signed Release APK artifact (PR)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: shutdownat2100-release-signed
          path: app/build/outputs/apk/release/*.apk
      - name: Upload updated lint baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shutdownat2100-lint-baseline
          path: app/lint-baseline.xml
      - name: Create CI Release (master push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci/auto-build-${{ github.run_number }}
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          prerelease: true
      - name: Verify release notes
        run: |
          echo "=== CI Build ${{ github.run_number }} ==="
          echo "Commit: ${{ github.sha }}"
          echo "Tag: ci/auto-build-${{ github.run_number }}"
          echo "Release notes generated from commit history"
          echo "Timestamp: ${{ github.event.head_commit.timestamp }}"
